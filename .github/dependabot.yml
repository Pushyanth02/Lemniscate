# Dependabot — keeps npm dependencies and GitHub Actions versions current.
# Bun lockfile (bun.lock) is supported by the npm ecosystem resolver.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Next.js and pdfjs-dist are pinned deliberately (static export +
    # worker alignment) — review those bumps by hand, the rest can group.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
